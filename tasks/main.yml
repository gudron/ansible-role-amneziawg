---
# tasks/main.yml - Main entry point for amneziawg role

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - amneziawg_addresses is defined
      - amneziawg_addresses | length > 0
    fail_msg: 'amneziawg_addresses must be defined with at least one VPN address'
    quiet: true
  tags:
    - amneziawg
    - amneziawg-config

- name: Validate AmneziaWG v3 timing and padding variables
  ansible.builtin.assert:
    that:
      - amneziawg_content_padding_addition | string == '' or amneziawg_content_padding_addition | string | regex_search('^\d+(-\d+)?$')
      - amneziawg_keepalive_timeout | string == '' or amneziawg_keepalive_timeout | string | regex_search('^\d+(-\d+)?$')
      - amneziawg_max_handshake_attempts | string == '' or amneziawg_max_handshake_attempts | string | regex_search('^\d+(-\d+)?$')
      - amneziawg_rekey_after_time | string == '' or amneziawg_rekey_after_time | string | regex_search('^\d+(-\d+)?$')
      - amneziawg_rekey_timeout | string == '' or amneziawg_rekey_timeout | string | regex_search('^\d+(-\d+)?$')
      - amneziawg_reject_after_time | string == '' or amneziawg_reject_after_time | string | regex_search('^\d+(-\d+)?$')
    fail_msg: 'AmneziaWG v3 timing/padding variables must be a u16 integer or an x-y range'
    quiet: true
  tags:
    - amneziawg
    - amneziawg-config

- name: Validate AmneziaWG v3 boolean flags
  ansible.builtin.assert:
    that:
      - amneziawg_advanced_security in ['', 'true', 'false', true, false]
      - amneziawg_disable_cookies in ['', 'true', 'false', true, false]
      - amneziawg_random_trailers in ['', 'true', 'false', true, false]
    fail_msg: "AmneziaWG v3 boolean flags must be 'true' or 'false'"
    quiet: true
  tags:
    - amneziawg
    - amneziawg-config

- name: Validate AmneziaWG v3 header protection key
  ansible.builtin.assert:
    that:
      - amneziawg_header_protection_key == '' or amneziawg_header_protection_key | regex_search('^[A-Za-z0-9+/]{43}=$')
    fail_msg: 'amneziawg_header_protection_key must be base64-encoded 32 bytes (44 chars ending with =)'
    quiet: true
  tags:
    - amneziawg
    - amneziawg-config

- name: Include tasks depending on OS
  ansible.builtin.include_tasks:
    file: "{{ item }}"
    apply:
      tags:
        - amneziawg
        - amneziawg-config
  with_first_found:
    - "install-{{ ansible_distribution | lower }}-{{ ansible_distribution_major_version }}.yml"
    - "install-{{ ansible_distribution | lower }}-{{ ansible_distribution_version }}.yml"
    - "install-{{ ansible_distribution | lower }}-{{ ansible_distribution_release }}.yml"
    - "install-{{ ansible_distribution | lower }}.yml"
  tags:
    - amneziawg
    - amneziawg-config

- name: Generate AmneziaWG keys
  ansible.builtin.include_tasks:
    file: generate-keys.yml
  tags:
    - amneziawg
    - amneziawg-keys

- name: Configure AmneziaWG interface
  ansible.builtin.include_tasks:
    file: configure.yml
  tags:
    - amneziawg
    - amneziawg-config
